name: Build Android APK

# 触发条件：
#   - 推送到 main/master 分支：自动构建 APK 并作为 Artifact 提供下载
#   - 推送 tag（如 v1.0.0）：自动构建 APK + AAB，并创建 GitHub Release 附上产物（变体）
#   - 手动触发 (workflow_dispatch)
#   - 在 GitHub 网页手动发布 Release：额外构建 AAB 并挂到 Release 页面
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  release:
    types: [published]

# 创建 Release / 上传产物需要写权限
permissions:
  contents: write

jobs:
  build:
    name: Build APK (and AAB on release/tag)
    # 固定到 ubuntu-24.04，避免 ubuntu-latest 于 2026-10-19 起自动迁移到 Ubuntu 26 带来的不确定性
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 1) Java 17 —— Flet/AGP 的硬性要求
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # 2) Python 3.12 —— 运行 flet CLI
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 3) 不手动装 Flutter！
      #    flet build 会自动下载并安装它钉死的 Flutter 版本到 ~/flutter/{version}，
      #    且会交互确认。手动用 flutter-action 装 stable 反而版本不符被拒绝、还白下载。
      #    这里只缓存 flet 自装的 Flutter，加速重复构建。
      - name: Cache Flutter (installed by flet)
        uses: actions/cache@v6
        with:
          path: ~/flutter
          key: ${{ runner.os }}-flet-flutter-${{ hashFiles('requirements-android.txt') }}
          restore-keys: ${{ runner.os }}-flet-flutter-

      # 4) Android SDK + 自动接受 licenses + 设置 ANDROID_HOME
      #    flet 会复用此 SDK；若项目 gradle 指定了特定 NDK 版本，会自行下载。
      #    显式列出所需包（注意包名格式：platforms;android-XX，带 s）。
      #    同时装 34 与 35 两个平台及对应 build-tools，覆盖不同 flet 版本的 compileSdk 需求。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-34 platforms;android-35 build-tools;34.0.0 build-tools;35.0.0"

      # 5) 缓存 pip，加速重复构建
      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-android.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      # 6) 安装安卓构建专用依赖（已排除无安卓 wheel 的 pyzbar / Pillow）
      - name: Install Python dependencies (Android)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-android.txt

      # 7) 构建 APK（分支推送 / PR / 手动 / tag 均执行）
      #    --yes   ：自动确认“Flutter 将自动下载安装”的交互提示（CI 无 TTY，否则 EOFError 崩溃）
      #    --arch  ：只打 arm64-v8a 单架构 APK，体积可从 ~68MB 降到 ~30MB
      #              （通用 APK 会把 3 套 ABI 的 Python/Flutter 原生库都打进去）
      #    --exclude：把测试与文档排除出 App 包体
      #    若你的手机是 32 位老机型，改用 --split-per-abi（产出 3 个单架构 APK 自行选择）。
      - name: Build APK (arm64 only)
        id: build_apk
        continue-on-error: true
        run: flet build apk --yes --arch arm64-v8a --exclude tests README.md PYCHARM.md --verbose

      # 7b) 回退：若 --arch 参数在当前 flet 版本不被支持，退化为默认（通用）APK，保证一定有产物
      - name: "Build APK (fallback: universal)"
        if: steps.build_apk.outcome == 'failure'
        run: flet build apk --yes --exclude tests README.md PYCHARM.md --verbose

      # 8) 构建 AAB（仅在发布 Release 或打 tag 时）
      - name: Build AAB
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        run: flet build aab --yes --verbose

      # 9) 上传 APK 作为构建产物（保留 14 天）
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: inventory-app-apk
          path: build/apk/
          retention-days: 14

      # 10) 上传 AAB 作为构建产物
      - name: Upload AAB artifact
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: inventory-app-aab
          path: build/aab/
          retention-days: 14

      # 11) 在 GitHub 网页手动发布 Release 时，把产物挂到 Release 页面
      - name: Attach to Release (manual)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/apk/*.apk
            build/aab/*.aab

      # 12) 打 tag 自动发 Release 变体：推送 v* tag 时自动创建 Release 并附上产物
      - name: Create Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            build/apk/*.apk
            build/aab/*.aab

# ──────────────────────────────────────────────────────────────
# 使用说明：
# 1. 本工作流假设 Flet 项目位于仓库根目录（pyproject.toml 在根）。
#    若项目在子目录，请在相关步骤加 working-directory。
# 2. 首次构建约需 10~20 分钟（需下载 Flutter/SDK/Gradle 依赖）。
# 3. 打 tag 自动发版：
#      git tag v1.0.0
#      git push origin v1.0.0
#    → 自动构建 APK+AAB 并创建名为 "Release v1.0.0" 的 GitHub Release。
# 4. 想自动签名：在仓库 Settings → Secrets 配置
#    KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD，
#    并在 pyproject.toml 的 [tool.flet.android.signing] 引用，
#    然后在「Build APK / Build AAB」步骤前加一步解码 keystore：
#     - name: Decode keystore
#       run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release-key.jks
# 5. 若构建报 NDK 缺失，可在「Set up Android SDK」后加：
#     - run: sdkmanager "ndk;25.1.8937393"
# 6. action 版本已升级到面向 Node 24 的最新大版本，并固定 runner 为
#    ubuntu-24.04，以消除 Node 20 弃用与 ubuntu-latest 迁移通知。
# ──────────────────────────────────────────────────────────────
