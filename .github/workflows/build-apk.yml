name: Build Android APK

# 触发条件：
#   - 推送到 main/master 分支：自动构建 APK 并作为 Artifact 提供下载
#   - 手动触发 (workflow_dispatch)：同上
#   - 发布 GitHub Release：额外构建 AAB 并作为资产附加到 Release 页面
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  release:
    types: [published]

# 仅 release 步骤需要写权限（附加资产到 Release）；普通构建用不到
permissions:
  contents: write

jobs:
  build:
    name: Build APK (and AAB on release)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1) Java 17 —— Flet/AGP 的硬性要求
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 2) Python 3.12 —— 运行 flet CLI
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3) Flutter stable —— 新版 flet build 需要系统 Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4) Android SDK + 自动接受 licenses + 设置 ANDROID_HOME
      #    flet 会复用此 SDK；若项目 gradle 指定了特定 NDK 版本，会自行下载。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 5) 缓存 pip，加速重复构建
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-android.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      # 6) 安装安卓构建专用依赖（已排除无安卓 wheel 的 pyzbar / Pillow）
      - name: Install Python dependencies (Android)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-android.txt

      # 7) 构建 APK
      - name: Build APK
        run: flet build apk --verbose

      # 8) 仅在发布 Release 时构建 AAB（Google Play 推荐格式）
      - name: Build AAB
        if: github.event_name == 'release'
        run: flet build aab --verbose

      # 9) 上传 APK 作为构建产物（保留 14 天）
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: inventory-app-apk
          path: build/apk/
          retention-days: 14

      # 10) 上传 AAB 作为构建产物
      - name: Upload AAB artifact
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: inventory-app-aab
          path: build/aab/
          retention-days: 14

      # 11) 把 APK/AAB 附加到 GitHub Release 页面
      - name: Attach to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/apk/*.apk
            build/aab/*.aab

# ──────────────────────────────────────────────────────────────
# 使用说明：
# 1. 本工作流假设 Flet 项目位于仓库根目录（pyproject.toml 在根）。
#    若项目在子目录（如 ./inventory_app），请在「Build APK / Build AAB」
#    步骤加 working-directory，或把整个子目录作为独立仓库。
# 2. 首次构建约需 10~20 分钟（需下载 Flutter/SDK/Gradle 依赖）。
# 3. 想自动签名：在仓库 Settings → Secrets 中配置
#    KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD，
#    并在 pyproject.toml 的 [tool.flet.android.signing] 引用，
#   然后在「Build APK」步骤前加一步解码 keystore：
#     - name: Decode keystore
#       run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release-key.jks
# 4. 若构建报 NDK 缺失，可在「Set up Android SDK」后加：
#     - run: sdkmanager "ndk;25.1.8937393"
# ──────────────────────────────────────────────────────────────
