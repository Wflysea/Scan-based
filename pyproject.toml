[project]
name = "inventory-scanner"
version = "1.0.0"
description = "扫码出入库管理 (Flet + SQLite)"
requires-python = ">=3.10"
dependencies = [
    # Flet 1.0 注意：ft.app(target=...) 已移除，入口改用 ft.run(main)。
    # 扩展包与 flet 主包**版本锁步**：flet-camera / flet-permission-handler 1.0.3
    # 的 requires_dist 是精确的 "flet==1.0.3"，故三者必须钉成同一版本，否则依赖冲突。
    "flet==1.0.3",
    "flet-camera==1.0.3",
    "flet-permission-handler==1.0.3",
    # pyzbar 在安卓无可用 wheel（依赖系统 libzbar，PyPI 最高仅 0.1.9），不能放进打包依赖；
    # 桌面端 pyzbar 仍由 requirements.txt 安装。
    # Pillow 同理：它只被 pyzbar 的解码路径使用（scan.py 内懒加载），安卓端用不到，
    # 从打包依赖移除可显著减小 APK 体积。
    "openpyxl>=3.1.0",
]

[tool.flet]
product = "扫码出入库"
artifact = "inventory_scanner"
org = "com.example"
bundle_id = "com.example.inventoryscanner"
build_number = 1
# 跨平台权限包：camera 会自动向 AndroidManifest 注入 CAMERA 权限
permissions = ["camera"]
# 自定义控件（mobile_scanner 原生扫码）路径；若你的 Flet 版本支持 controls，取消注释：
# controls = ["app/scanner/dart"]

[tool.flet.android.permission]
"android.permission.CAMERA" = true
"android.permission.INTERNET" = true

[tool.flet.android.feature]
"android.hardware.camera" = true
"android.hardware.camera.autofocus" = true

# 正式发布签名（可选）：填入你的 keystore 后取消注释
# [tool.flet.android.signing]
# key_store = "keystore/release.jks"
# key_alias = "release"
# key_password = "your_password"
# store_password = "your_store_password"
